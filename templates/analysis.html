<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析結果 - YouTube Comments Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>YouTube コメント分析結果</h1>
            <div class="header-links">
                <a href="/" class="btn-link">← 新規分析</a>
                <a href="/history" class="btn-link">分析履歴</a>
            </div>
        </header>

        <main>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>読み込み中...</p>
            </div>

            <div id="share-section" class="share-section" style="display: none;">
                <p>このページのURL:</p>
                <div class="share-url">
                    <input type="text" id="share-url-input" readonly>
                    <button onclick="copyUrl()">コピー</button>
                </div>
            </div>

            <div id="results" style="display: none;">
                <!-- 動画情報 -->
                <section class="video-info">
                    <h2>動画情報</h2>
                    <div id="video-details"></div>
                </section>

                <!-- 統計情報 -->
                <section class="statistics">
                    <h2>統計情報</h2>
                    <div id="stats-grid" class="stats-grid"></div>
                </section>

                <!-- 年別統計 -->
                <section class="yearly-stats">
                    <h2>年別コメント推移</h2>
                    <div class="chart-container">
                        <canvas id="yearly-chart"></canvas>
                    </div>
                    <div id="yearly-table"></div>
                </section>

                <!-- 頻出ワード -->
                <section class="word-frequency">
                    <h2>頻出ワード Top 20</h2>
                    <div id="word-freq-chart"></div>
                </section>

                <!-- 人気のコメント -->
                <section class="top-comments">
                    <h2>いいね数が多いコメント Top 10</h2>
                    <div id="top-comments-list"></div>
                </section>

                <!-- 最新のコメント -->
                <section class="recent-comments">
                    <h2>最新のコメント</h2>
                    <div id="recent-comments-list"></div>
                </section>
            </div>
        </main>

        <footer>
            <p>YouTube Comments Analyzer &copy; 2024</p>
        </footer>
    </div>

    <script>
        const analysisId = {{ analysis_id }};

        async function loadAnalysis() {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const shareSection = document.getElementById('share-section');

            try {
                const response = await fetch(`/api/analysis/${analysisId}`);
                if (!response.ok) {
                    throw new Error('分析結果が見つかりません');
                }

                const data = await response.json();

                // 共有URL設定
                const shareUrlInput = document.getElementById('share-url-input');
                shareUrlInput.value = window.location.href;
                shareSection.style.display = 'block';

                displayResults(data);
                results.style.display = 'block';
                loading.style.display = 'none';

            } catch (error) {
                loading.innerHTML = `<p style="color: #c33;">エラー: ${error.message}</p>`;
            }
        }

        function displayResults(data) {
            // 動画情報
            const videoDetails = document.getElementById('video-details');
            videoDetails.innerHTML = `
                <div class="video-detail-item">
                    <strong>タイトル:</strong> ${escapeHtml(data.video_info.title)}
                </div>
                <div class="video-detail-item">
                    <strong>チャンネル:</strong> ${escapeHtml(data.video_info.channel)}
                </div>
                <div class="video-detail-item">
                    <strong>公開日:</strong> ${formatDate(data.video_info.published_at)}
                </div>
                <div class="video-detail-item">
                    <strong>再生回数:</strong> ${data.video_info.view_count.toLocaleString()}回
                </div>
                <div class="video-detail-item">
                    <strong>いいね数:</strong> ${data.video_info.like_count.toLocaleString()}
                </div>
                <div class="video-detail-item">
                    <strong>コメント数:</strong> ${data.video_info.comment_count.toLocaleString()}
                </div>
            `;

            // 統計情報
            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${data.statistics.total_comments}</div>
                    <div class="stat-label">取得コメント数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.statistics.total_likes.toLocaleString()}</div>
                    <div class="stat-label">合計いいね数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.statistics.average_likes}</div>
                    <div class="stat-label">平均いいね数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.statistics.max_likes}</div>
                    <div class="stat-label">最大いいね数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${Math.round(data.statistics.average_comment_length)}</div>
                    <div class="stat-label">平均コメント文字数</div>
                </div>
            `;

            // 年別統計の表示
            if (data.yearly_stats && Object.keys(data.yearly_stats).length > 0) {
                displayYearlyStats(data.yearly_stats);
            }

            // 頻出ワード
            const wordFreqChart = document.getElementById('word-freq-chart');
            const maxFreq = data.word_frequency[0] ? data.word_frequency[0][1] : 1;
            wordFreqChart.innerHTML = data.word_frequency.map(([word, count]) => `
                <div class="word-item">
                    <div class="word-label">${escapeHtml(word)}</div>
                    <div class="word-bar-container">
                        <div class="word-bar" style="width: ${(count / maxFreq) * 100}%"></div>
                        <span class="word-count">${count}</span>
                    </div>
                </div>
            `).join('');

            // 人気のコメント
            const topCommentsList = document.getElementById('top-comments-list');
            topCommentsList.innerHTML = data.top_comments.map((comment, index) => `
                <div class="comment-card">
                    <div class="comment-header">
                        <span class="comment-rank">#${index + 1}</span>
                        <span class="comment-author">${escapeHtml(comment.author)}</span>
                        <span class="comment-likes">👍 ${comment.like_count}</span>
                    </div>
                    <div class="comment-text">${escapeHtml(comment.text)}</div>
                    <div class="comment-date">${formatDate(comment.published_at)}</div>
                </div>
            `).join('');

            // 最新のコメント
            const recentCommentsList = document.getElementById('recent-comments-list');
            recentCommentsList.innerHTML = data.recent_comments.map((comment) => `
                <div class="comment-card">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHtml(comment.author)}</span>
                        <span class="comment-likes">👍 ${comment.like_count}</span>
                    </div>
                    <div class="comment-text">${escapeHtml(comment.text)}</div>
                    <div class="comment-date">${formatDate(comment.published_at)}</div>
                </div>
            `).join('');
        }

        function displayYearlyStats(yearlyStats) {
            const years = Object.keys(yearlyStats).sort();
            const counts = years.map(year => yearlyStats[year].count);
            const avgLikes = years.map(year => yearlyStats[year].average_likes);

            // グラフの描画
            const ctx = document.getElementById('yearly-chart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [
                        {
                            label: 'コメント数',
                            data: counts,
                            backgroundColor: 'rgba(102, 126, 234, 0.5)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 2,
                            yAxisID: 'y'
                        },
                        {
                            label: '平均いいね数',
                            data: avgLikes,
                            backgroundColor: 'rgba(118, 75, 162, 0.5)',
                            borderColor: 'rgba(118, 75, 162, 1)',
                            borderWidth: 2,
                            type: 'line',
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'コメント数'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: '平均いいね数'
                            },
                            grid: {
                                drawOnChartArea: false
                            }
                        }
                    }
                }
            });

            // テーブル表示
            const yearlyTable = document.getElementById('yearly-table');
            yearlyTable.innerHTML = `
                <table class="yearly-table">
                    <thead>
                        <tr>
                            <th>年</th>
                            <th>コメント数</th>
                            <th>合計いいね数</th>
                            <th>平均いいね数</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${years.map(year => {
                            const stats = yearlyStats[year];
                            return `
                                <tr>
                                    <td>${year}</td>
                                    <td>${stats.count}</td>
                                    <td>${stats.total_likes.toLocaleString()}</td>
                                    <td>${stats.average_likes}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function copyUrl() {
            const input = document.getElementById('share-url-input');
            input.select();
            document.execCommand('copy');
            alert('URLをコピーしました');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('ja-JP');
        }

        // ページ読み込み時に分析結果を取得
        loadAnalysis();
    </script>
</body>
</html>
